name: Deploy both questionnaire branches to GitHub Pages

on:
  push:
    branches: [main, experimental]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout production
        uses: actions/checkout@v4
        with:
          ref: main
          path: production
      - name: Checkout experimental
        uses: actions/checkout@v4
        with:
          ref: experimental
          path: experimental
      - name: Assemble both websites
        run: |
          mkdir -p public/experimental
          cp -a production/. public/
          rm -rf public/.git public/.github
          cp -a experimental/. public/experimental/
          rm -rf public/experimental/.git public/experimental/.github
          touch public/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
